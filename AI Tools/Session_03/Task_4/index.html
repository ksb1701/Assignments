<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4 - Movie Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card-container">
        <div class="movie-card">
            <div class="movie-poster">
                <!-- Using a placeholder color/text instead of an image file to keep repo clean -->
                <div class="poster-placeholder">
                    <span>POSTER</span>
                </div>
                <div class="rating-badge">⭐ 8.5/10</div>
            </div>
            <div class="movie-info">
                <h3 class="movie-title">The Grand Adventure</h3>
                <p class="movie-genre">Action • Adventure • Fantasy</p>
                <button class="book-now-btn">Book Now</button>
            </div>
        </div>
    </div>
</body>
</html>
